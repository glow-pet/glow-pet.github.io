<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 | 창작</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="assets/js/admin.js" defer></script>
</head>
<body>

    <nav class="admin-navbar">
        <div style="display: flex; align-items: center; gap: 2rem;">
            <a href="index.html" class="admin-nav-home">홈</a>
            <span class="admin-nav-title">관리</span>
        </div>
        <div style="display: flex; gap: 8px;">
            <button onclick="downloadJson()" class="admin-dark-btn" style="padding: 0.5rem 1.2rem;" title="posts.json 저장">posts.json 저장</button>
            <button onclick="downloadProfileJson()" class="admin-dark-btn" style="padding: 0.5rem 1.2rem;" title="profiles.json 저장">profiles.json 저장</button>
        </div>
    </nav>

    <div class="admin-layout-wrapper" id="adminLayoutWrapper">
        <!-- 1열: 사이드바 -->
        <aside class="admin-sidebar">
            <div class="admin-column-header">카테고리</div>
            <div class="admin-sidebar-menu-list">
                <button class="admin-menu-btn" onclick="selectCategory('1차창작')">1차 창작</button>
                <button class="admin-menu-btn" onclick="selectCategory('2차창작')">2차 창작</button>
            </div>
        </aside>

        <!-- 2열: 콘텐츠 목록 영역 -->
        <main class="admin-content-pane" id="contentPane">
            <div id="contentPaneInner" style="display: none; flex-direction: column; height: 100%;">
                <div class="admin-column-header">
                    <span id="currentTabTitle">콘텐츠 목록</span>
                    <button onclick="openEditEditor(null)" class="admin-dark-btn" id="addNewBtn">+ 새 항목</button>
                </div>
                <div class="admin-card-list" id="cardGrid" style="flex: 1; overflow-y: scroll;"></div>
                <!-- 2열 하단 페이지네이션 -->
                <div id="adminPagination" class="pagination-container" style="margin: 1rem 0 0 0;"></div>
            </div>
            <div id="contentPanePlaceholder" style="display: flex; align-items: center; justify-content: center; height: 100%; color: #aaa; font-size: 0.9rem;">
                카테고리를 선택해주세요.
            </div>
        </main>

        <!-- 3열: 수정 / 추가 에디터 패널 -->
        <aside class="admin-editor-pane" id="editorPane">
            <div id="editorPaneInner" style="display: none; flex-direction: column;">
                <div class="admin-column-header">
                    <span id="editorTitle">항목 수정</span>
                </div>

                <!-- 2차 창작(posts) 전용 폼 -->
                <form id="editForm" style="display: flex; flex-direction: column; gap: 12px; margin-top: 0.5rem;">
                    <input type="hidden" id="cardId">
                    <div class="form-group" style="display:none;">
                        <label>카테고리</label>
                        <select id="cardCategory">
                            <option value="1차창작">1차창작</option>
                            <option value="2차창작" selected>2차창작</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                            <label style="margin-bottom: 0;">태그 (필터에서 선택)</label>
                            <button type="button" class="admin-dark-btn" onclick="openTagHierarchyModal()">수정</button>
                        </div>
                        <input type="text" id="cardTags" readonly class="admin-tag-input-line" placeholder="아래 태그 필터에서 선택하세요">
                        <div id="tagSelectorBox" class="admin-tag-selector-box" style="margin-top: 8px; padding: 8px; background: #fff; border: 1px solid #eee; border-radius: 6px;"></div>
                    </div>
                    <div class="form-group">
                        <label>이미지 추가</label>
                        <div id="imagePathPreview" class="image-path-preview">assets/images/fanworks/</div>
                        <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                            <input type="text" id="newImgFilename" placeholder="파일명 (확장자 제외)" style="flex: 1;">
                            <button type="button" onclick="addImagePath()" class="admin-dark-btn">추가</button>
                        </div>
                        <div id="imageList" class="image-list"></div>
                    </div>
                    <div class="form-group">
                        <label>alt (캡션)</label>
                        <textarea id="cardAlt" rows="5" style="resize: none;"></textarea>
                    </div>
                    <div class="form-group">
                        <label>날짜</label>
                        <input type="date" id="cardDate" style="width: 35%;">
                    </div>
                    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 1rem; border-top: 1px solid #eaeaea; padding-top: 1rem;">
                        <button type="submit" id="saveBtn" class="admin-dark-btn" style="padding: 0.5rem 1.5rem;" disabled>적용</button>
                    </div>
                </form>

                <!-- 1차 창작 프로필 전용 폼 -->
                <form id="ocForm" style="display: none; flex-direction: column; gap: 12px; margin-top: 0.5rem;">
                    <input type="hidden" id="ocId">
                    <div class="form-group">
                        <label>성명</label>
                        <input type="text" id="ocName" required>
                    </div>
                    <div class="form-group">
                        <label>성명 외국어 표기</label>
                        <input type="text" id="ocForeignName">
                    </div>
                    <div class="form-group">
                        <label>칭호</label>
                        <input type="text" id="ocTitle">
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
                        <div class="form-group">
                            <label>나이</label>
                            <input type="text" id="ocAge" placeholder="예: 22">
                        </div>
                        <div class="form-group">
                            <label>성별</label>
                            <input type="text" id="ocGender" placeholder="예: 여성">
                        </div>
                        <div class="form-group">
                            <label>키 (cm)</label>
                            <input type="text" id="ocHeight" placeholder="예: 168">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>카드 썸네일 이미지 경로</label>
                        <input type="text" id="ocThumbnail" placeholder="assets/images/ocs/filename_thumb.webp">
                    </div>
                    <div class="form-group">
                        <label>모달 초상화 이미지 경로 (세로 꽉 차는 이미지)</label>
                        <input type="text" id="ocPortrait" placeholder="assets/images/ocs/filename_portrait.webp">
                    </div>
                    <div class="form-group">
                        <label>상세 설정 및 설명 (우측 2열 스크롤 텍스트)</label>
                        <textarea id="ocDescription" rows="8" style="resize: none;"></textarea>
                    </div>
                    <div class="form-group">
                        <label>등록 날짜</label>
                        <input type="date" id="ocDate" style="width: 40%;">
                    </div>
                    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 1rem; border-top: 1px solid #eaeaea; padding-top: 1rem;">
                        <button type="submit" id="ocSaveBtn" class="admin-dark-btn" style="padding: 0.5rem 1.5rem;" disabled>적용</button>
                    </div>
                </form>

            </div>
            <div id="editorPanePlaceholder" style="display: flex; align-items: center; justify-content: center; height: 100%; color: #aaa; font-size: 0.9rem;">
                수정할 카드를 선택해주세요.
            </div>
        </aside>
    </div>

    <!-- 태그 위계 구조 수정 모달 -->
    <div class="tag-edit-modal-overlay" id="tagEditModal">
        <div class="tag-edit-modal-content" onclick="event.stopPropagation()">
            <div class="tag-edit-modal-header">
                <h3>태그 위계 구조 관리</h3>
                <button type="button" class="admin-dark-btn" onclick="applyTagHierarchyModal()">저장</button>
            </div>
            <div class="tag-edit-columns-wrapper">
                <div class="tag-edit-col">
                    <h4>작품</h4>
                    <div id="editColWorks" style="display: flex; flex-direction: column; gap: 6px;"></div>
                </div>
                <div class="tag-edit-col">
                    <h4>캐릭터</h4>
                    <div id="editColChars" style="display: flex; flex-direction: column; gap: 6px;"></div>
                </div>
                <div class="tag-edit-col">
                    <h4>관계</h4>
                    <div id="editColRels" style="display: flex; flex-direction: column; gap: 6px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 작품 삭제 재확인 전용 모달 -->
    <div class="work-delete-modal-overlay" id="workDeleteModal">
        <div class="work-delete-modal-card" onclick="event.stopPropagation()">
            <div class="work-delete-modal-text">정말로 삭제하시겠습니까?<br>하위 항목들까지 모두 삭제됩니다.</div>
            <div style="display: flex; gap: 8px; justify-content: center;">
                <button type="button" class="admin-dark-btn" style="padding: 0.4rem 1rem; background: #e74c3c;" onclick="confirmDeleteWork()">삭제</button>
                <button type="button" class="admin-dark-btn" style="padding: 0.4rem 1rem; background: #888;" onclick="closeWorkDeleteModal()">취소</button>
            </div>
        </div>
    </div>

</body>
</html>
