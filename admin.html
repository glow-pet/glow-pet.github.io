<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 | 창작</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="assets/js/admin.js" defer></script>
</head>
<body>

    <nav class="navbar">
        <div style="display: flex; align-items: center; gap: 2rem;">
            <a href="index.html" class="admin-nav-home">홈</a>
            <span class="admin-nav-title">관리</span>
        </div>
        <div style="display: flex; gap: 8px;">
            <button onclick="downloadJson()" class="dark-btn" title="fanworks.json 저장">fanworks.json 저장</button>
            <button onclick="downloadProfileJson()" class="dark-btn" title="profiles.json 저장">profiles.json 저장</button>
            <button onclick="downloadFavsJson()" class="dark-btn" title="favs.json 저장">favs.json 저장</button>
        </div>
    </nav>

    <div class="admin-layout-wrapper" id="adminLayoutWrapper">
        <aside class="admin-sidebar">
            <div class="admin-column-header">카테고리</div>
            <div class="admin-sidebar-menu-list">
                <button class="admin-menu-btn" onclick="selectCategory('1차창작')">1차 창작</button>
                <button class="admin-menu-btn" onclick="selectCategory('2차창작')">2차 창작</button>
                <button class="admin-menu-btn" onclick="selectCategory('관심작품')">관심 작품</button>
            </div>
        </aside>

        <main class="admin-content-pane" id="contentPane">
            <div id="contentPaneInner" style="display: none; flex-direction: column; height: 100%;">
                <div class="admin-column-header">
                    <span id="currentTabTitle">목록</span>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <button onclick="openOrderModal('1차창작')" class="dark-btn" id="orderBtn">정렬</button>
                        <button onclick="openEditEditor(null)" class="dark-btn" id="addNewBtn">추가</button>
                    </div>
                </div>
                <div class="admin-card-list" id="cardGrid"></div>
                <div id="adminPagination" class="pagination-container"></div>
            </div>
            <div id="contentPanePlaceholder" style="display: flex; align-items: center; justify-content: center; height: 100%; color: #aaa; font-size: 0.9rem;">
                카테고리를 선택해주세요.
            </div>
        </main>

        <aside class="admin-editor-pane" id="editorPane">
            <div id="editorPaneInner" style="display: none; flex-direction: column; height: 100%;">
                <div class="admin-column-header">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span id="editorTitle">수정</span>
                        <span id="editorIdDisplay" style="font-size: 0.8rem; color: #888; font-weight: normal;"></span>
                    </div>
                    <div>
                        <button type="submit" form="editForm" id="saveBtn" class="dark-btn" style="display: none;" disabled>적용</button>
                        <button type="submit" form="ocForm" id="ocSaveBtn" class="dark-btn" style="display: none;" disabled>적용</button>
                        <button type="submit" form="favForm" id="favSaveBtn" class="dark-btn" style="display: none;" disabled>적용</button>
                    </div>
                </div>

                <!-- 1차 창작 수정 패널 -->
                <div style="flex: 1; overflow-y: auto; padding-top: 0.5rem;">
                    <form class="edit" id="ocForm" style="display: none; flex-direction: column; gap: 12px;">
                        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
                            <div class="form-group">
                                <label>성명</label>
                                <input type="text" id="ocName" required>
                            </div>
                            <div class="form-group">
                                <label>성명 외국어 표기</label>
                                <input type="text" id="ocForeignName">
                            </div>
                            <div class="form-group">
                                <label>칭호</label>
                                <input type="text" id="ocTitle">
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
                            <div class="form-group">
                                <label>나이</label>
                                <input type="text" id="ocAge" placeholder="예: 18세">
                            </div>
                            <div class="form-group">
                                <label>성별</label>
                                <input type="text" id="ocGender" placeholder="예: 여성">
                            </div>
                            <div class="form-group">
                                <label>키 (cm)</label>
                                <input type="text" id="ocHeight" placeholder="예: 165">
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;">
                        <div class="form-group">
                            <label>썸네일 이미지</label>
                            <div class="image-path-preview">assets/images/ocs/</div>
                            <div style="display: flex; gap: 8px;">
                                <input type="text" id="ocNewThumbnailInput" placeholder="파일명(확장자 제외)" style="flex: 1;">
                                <button type="button" onclick="addOcThumbnailImage()" class="dark-btn">추가</button>
                            </div>
                            <div id="ocThumbnailList" class="image-list"></div>
                        </div>
                        <div class="form-group">
                            <label>전신 이미지</label>
                            <div class="image-path-preview">assets/images/ocs/</div>
                            <div style="display: flex; gap: 8px;">
                                <input type="text" id="ocNewPortraitInput" placeholder="파일명(확장자 제외)" style="flex: 1;">
                                <button type="button" onclick="addOcPortraitImage()" class="dark-btn">추가</button>
                            </div>
                            <div id="ocPortraitList" class="image-list"></div>
                        </div>
                        </div>
                        <div class="form-group">
                            <label>세부 정보</label>
                            <textarea id="ocDescription" rows="8" style="resize: none; height: 300px;"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label style="font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; display: block;">표시 설정</label>
                            
                            <!-- CSS Grid 적용: [라디오/체크박스] [라벨] [입력칸] 3개 열로 세로선 고정 -->
                            <div style="display: grid; grid-template-columns: auto auto 1fr; row-gap: 8px; column-gap: 10px; align-items: center; width: 100%;">
                                
                                <!-- 1행: 비공개 -->
                                <input type="checkbox" id="ocPrivate" style="width: auto; margin: 0; justify-self: center;">
                                <label for="ocPrivate" style="cursor: pointer; font-size: 0.9rem; font-weight: normal; margin: 0; white-space: nowrap;">비공개</label>
                                <div></div>

                                <!-- 2행: 전연령 -->
                                <input type="radio" name="oc-admin-rating" value="all" checked id="ocRadioAll" style="width: auto; margin: 0; justify-self: center;">
                                <label for="ocRadioAll" style="cursor: pointer; font-size: 0.9rem; font-weight: normal; margin: 0; white-space: nowrap;">전연령</label>
                                <div></div>

                                <!-- 3행: 성인물(경고) -->
                                <input type="radio" name="oc-admin-rating" value="warning" id="ocRadioWarning" style="width: auto; margin: 0; justify-self: center;">
                                <label for="ocRadioWarning" style="cursor: pointer; font-size: 0.9rem; font-weight: normal; margin: 0; white-space: nowrap;">성인물(경고)</label>
                                <input type="text" id="ocWarningContent" placeholder="상세 콘텐츠" style="width: 100%; padding: 6px 8px; font-size: 0.95rem; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">

                            </div>
                        </div>
                    </form>
                                        
                    <!-- 2차 창작 폼 -->
                    <form class="edit" id="editForm" style="display: flex; flex-direction: column; gap: 12px;">
                        <input type="hidden" id="cardId">
                        <div class="form-group" style="display:none;">
                            <label>카테고리</label>
                            <select id="cardCategory">
                                <option value="1차창작">1차창작</option>
                                <option value="2차창작" selected>2차창작</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>이미지 추가</label>
                            <div id="imagePathPreview" class="image-path-preview">assets/images/fanworks/</div>
                            <div style="display: flex; gap: 8px;">
                                <input type="text" id="newImgFilename" placeholder="파일명(확장자 제외)" style="flex: 1;">
                                <button type="button" onclick="addImagePath()" class="dark-btn">추가</button>
                            </div>
                            <div id="imageList" class="image-list"></div>
                        </div>

                        <div class="form-group">
                            <label style="font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; display: block;">표시 설정</label>
                            
                            <!-- 2차 창작 전용 ID 및 name이 적용된 그리드 레이아웃 -->
                            <div style="display: grid; grid-template-columns: auto auto 1fr; row-gap: 8px; column-gap: 10px; align-items: center; width: 100%;">
                                
                                <!-- 1행: 비공개 -->
                                <input type="checkbox" id="cardPrivate" style="width: auto; margin: 0; justify-self: center;">
                                <label for="cardPrivate" style="cursor: pointer; font-size: 0.9rem; font-weight: normal; margin: 0; white-space: nowrap;">비공개</label>
                                <div></div>

                                <!-- 2행: 전연령 -->
                                <input type="radio" name="admin-rating" value="all" checked id="cardRadioAll" style="width: auto; margin: 0; justify-self: center;">
                                <label for="cardRadioAll" style="cursor: pointer; font-size: 0.9rem; font-weight: normal; margin: 0; white-space: nowrap;">전연령</label>
                                <div></div>

                                <!-- 3행: 성인물(경고) -->
                                <input type="radio" name="admin-rating" value="warning" id="cardRadioWarning" style="width: auto; margin: 0; justify-self: center;">
                                <label for="cardRadioWarning" style="cursor: pointer; font-size: 0.9rem; font-weight: normal; margin: 0; white-space: nowrap;">성인물(경고)</label>
                                <input type="text" id="cardWarningContent" placeholder="상세 콘텐츠" style="width: 100%; padding: 6px 8px; font-size: 0.95rem; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">

                                <!-- 4행: 성인물(외부링크) -->
                                <input type="radio" name="admin-rating" value="external" id="cardRadioExternal" style="width: auto; margin: 0; justify-self: center;">
                                <label for="cardRadioExternal" style="cursor: pointer; font-size: 0.9rem; font-weight: normal; margin: 0; white-space: nowrap;">성인물(외부링크)</label>
                                <input type="text" id="cardExternalLink" placeholder="외부 링크" style="width: 100%; padding: 6px 8px; font-size: 0.95rem; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">

                            </div>
                        </div>
                        
                        <div class="form-group">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                                <label style="margin-bottom: 0;">태그</label>
                                <button type="button" class="dark-btn" onclick="openTagHierarchyModal()">태그 필터 편집</button>
                            </div>
                            <input type="text" id="cardTags" readonly class="admin-tag-input-line" placeholder="여기에 선택한 태그가 나열됩니다.">
                            <div id="tagSelectorBox" class="admin-tag-selector-box" style="margin-top: 8px; padding: 8px; background: #fff; border: 1px solid #eee; border-radius: 6px;"></div>
                        </div>

                        <div class="form-group">
                            <label>날짜</label>
                            <input type="date" id="cardDate" style="width: 35%;">
                        </div>

                        <div class="form-group">
                            <label>alt (캡션)</label>
                            <textarea id="cardAlt" rows="5" style="resize: none;"></textarea>
                        </div>
                    </form>


                    <!-- 관심 작품 수정 패널 -->
                    <form class="edit" id="favForm" style="display: none; flex-direction: column; gap: 12px; margin-bottom: 100px;">
                        <div class="form-group">
                            <label>작품</label>
                            <input type="text" id="favTitle" required>
                        </div>
                        <div class="form-group">
                            <label>매체</label>
                            <input type="text" id="favMedia">
                        </div>
                        <div class="form-group">
                            <label>캐릭터</label>
                            <input type="text" id="favCharacter">
                        </div>
                        <div class="form-group">
                            <label>관계</label>
                            <input type="text" id="favRelation">
                        </div>
                    </form>
                </div>
            </div>
            <div id="editorPanePlaceholder" style="display: flex; align-items: center; justify-content: center; height: 100%; color: #aaa; font-size: 0.9rem;">
                수정할 게시물을 선택해주세요.
            </div>
        </aside>
    </div>

    <!-- 태그 위계 구조 수정 모달 -->
    <div class="tag-edit-modal-overlay" id="tagEditModal">
        <div class="tag-edit-modal-content" onclick="event.stopPropagation()">
            <div class="tag-edit-modal-header">
                <h3>태그 위계 구조 관리</h3>
                <button type="button" class="dark-btn" onclick="applyTagHierarchyModal()">저장</button>
            </div>
            <div class="tag-edit-columns-wrapper">
                <div class="tag-edit-col">
                    <h4>작품</h4>
                    <div id="editColWorks" style="display: flex; flex-direction: column; gap: 6px;"></div>
                </div>
                <div class="tag-edit-col">
                    <h4>캐릭터</h4>
                    <div id="editColChars" style="display: flex; flex-direction: column; gap: 6px;"></div>
                </div>
                <div class="tag-edit-col">
                    <h4>관계</h4>
                    <div id="editColRels" style="display: flex; flex-direction: column; gap: 6px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 작품 삭제 재확인 전용 모달 -->
    <div class="work-delete-modal-overlay" id="workDeleteModal">
        <div class="work-delete-modal-card" onclick="event.stopPropagation()">
            <div class="work-delete-modal-text">정말로 삭제하시겠습니까?<br>하위 항목들까지 모두 삭제됩니다.</div>
            <div style="display: flex; gap: 8px; justify-content: center;">
                <button type="button" class="dark-btn" style="background: #e74c3c;" onclick="confirmDeleteWork()">삭제</button>
                <button type="button" class="dark-btn" style="background: #888;" onclick="closeWorkDeleteModal()">취소</button>
            </div>
        </div>
    </div>

    <!-- 순서 변경 모달 -->
    <div class="tag-edit-modal-overlay" id="orderModal">
        <div class="tag-edit-modal-content" onclick="event.stopPropagation()" style="max-width: 500px; max-height: 80vh; display: flex; flex-direction: column;">
            <div class="tag-edit-modal-header">
                <h3 id="orderModalTitle">정렬</h3>
                <button type="button" class="dark-btn" onclick="closeOrderModal()" style="background:none; border:none; color:#666; font-size:1.5rem; cursor:pointer;">✕</button>
            </div>
            <div style="font-size: 0.8rem; color: #666; margin-bottom: 10px;">
                ▲/▼ 버튼을 누르거나 목록 항목을 드래그하여 순서를 변경하세요.
            </div>
            <div id="orderListContainer" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 4px;">
                <!-- JS로 동적 생성됨 -->
            </div>
            <!-- 모달 하단 적용 버튼 추가 -->
            <div style="display: flex; justify-content: flex-end; border-top: 1px solid #eaeaea; margin-top: 1rem; padding-top: 1rem;">
                <button type="button" class="dark-btn" onclick="applyOrderChanges()">적용</button>
            </div>
        </div>
    </div>

</body>
</html>
