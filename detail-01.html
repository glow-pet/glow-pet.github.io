<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새벽의 도심 관측 - MY ART ARCHIVE</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo"><a href="index.html">MY ART ARCHIVE</a></div>
    <ul class="nav-links">
      <li><a href="index.html" class="active">Illustration</a></li>
      <li><a href="category-b.html">Editorial</a></li>
    </ul>
  </nav>

  <main class="container">
    
    <!-- 뒤로가기 버튼 -->
    <a href="index.html" class="back-button">← 목록으로 돌아가기</a>

    <!-- 작품 정보 헤더 (노션 상단 속성창 스타일) -->
    <header class="detail-header">
      <h1 class="detail-title">새벽의 도심 관측</h1>
      
      <div class="notion-properties">
        <div class="property-row">
          <span class="property-label">👤 등장인물</span>
          <span class="property-value">
            <span class="notion-tag tag-blue">아크</span>
            <span class="notion-tag tag-purple">루나</span>
          </span>
        </div>
        <div class="property-row">
          <span class="property-label">🏙️ 배경</span>
          <span class="property-value">
            <span class="notion-tag tag-gray">미래도시</span>
            <span class="notion-tag tag-gray">옥상</span>
          </span>
        </div>
        <div class="property-row">
          <span class="property-label">📅 작업 기간</span>
          <span class="property-value">2026.10.01 ~ 2026.10.05</span>
        </div>
        <div class="property-row">
          <span class="property-label">🛠️ 사용 툴</span>
          <span class="property-value">Krita, Photoshop</span>
        </div>
      </div>

      <div class="detail-description">
        <p>사이보그 캐릭터 아크와 루나가 새벽녘 도시를 관측하는 컨셉의 그래픽 작업물입니다. 푸른 톤의 전경과 네온 사인의 대비를 강조했습니다.</p>
      </div>
    </header>

    <!-- 여러 장의 이미지를 위에서 아래로 정렬하는 스택 -->
    <section class="image-stack">
      
      <!-- 1번 이미지 (메인 썸네일 이미지) -->
      <figure class="stack-item">
        <img src="https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=1200" alt="완성작 일러스트">
        <figcaption class="image-caption">01. 메인 일러스트 완성본</figcaption>
      </figure>

      <!-- 2번 이미지 (차분/클로즈업 등 추가 이미지) -->
      <figure class="stack-item">
        <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=1200" alt="캐릭터 클로즈업">
        <figcaption class="image-caption">02. 인물 디테일 및 텍스처 클로즈업</figcaption>
      </figure>

      <!-- 3번 이미지 (스케치 또는 과정샷) -->
      <figure class="stack-item">
        <img src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=1200" alt="초기 아이디어 스케치">
        <figcaption class="image-caption">03. 초기 레이아웃 및 라이팅 구상 스케치</figcaption>
      </figure>

    </section>

  </main>

</body>
</html>
